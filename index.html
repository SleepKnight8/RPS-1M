<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>RPS to 1M</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image.png">
</head>
<body>
        <div id="GameContainer">
        <h1 id="GameName">RPS to 1M</h1>
        <h2 id="GameMission">a game where you play RPS (Rock, Paper, Scissors) and try to collect 1M dollars to win the game.</h2>
        <h3>Game Status</h3>
        <div id="GameStatusDiv">
            <h4 id="WinStatus">Wins: </h4>
            <h4 id="LoseStatus">Loses: </h4>
        </div>
        <div id="GameResultDiv">
            <p id="ComputerMoveDisplay">Computer Move</p>
            <p id="result">Result</p>
            <p id="BetResult">Bet Result</p>
        </div>
        <h3 id="MoneyDisplay">50000</h3>
        <h3 id="BetDisplay">1000</h3>
        <div id="MoneyBetDiv">
            <button id="Increase" onclick="BetFunc(this)">+</button>
            <button id="Decrease" onclick="BetFunc(this)">-</button>
        </div>
        <h3>Your Move</h3>
        <div id="MoveDiv">

            <button onclick="chooseMove(this)" class="PlayerMove" value="R">
                👊
            </button>

            <button onclick="chooseMove(this)" class="PlayerMove" value="P">
                🖐️
            </button>

            <button onclick="chooseMove(this)" class="PlayerMove" value="S">
                ✌️
            </button>

        </div>
        <br>
        <button id="StartGame" onclick="play()">Start</button>
        <button id="RestartGame" onclick="restart()">Restart</button>
        <h2>The Best Developer</h2>

        <a href="https://github.com/SleepKnight8" target="_blank" style="color: #f5e05a">SleepKnight8</a>
        <p id="copyright">© 2026 SleepKnight8. All rights reserved.</p>
        </div>

    <script src="index.js"></script>
</body>
</html>
